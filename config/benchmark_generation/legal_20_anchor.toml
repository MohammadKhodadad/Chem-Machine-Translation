name = "jrc_acquis_legal_20_anchor"
domain = "jrc"

[[builds]]
name = "articles"
kind = "jrc_acquis_snapshot"
source_pairs_jsonl = "benchmark_sources/jrc_acquis_anchored_articles_20_anchor_docs.jsonl"
output_dir = "benchmark_datasets/jrc_acquis_anchored_articles_20_anchors"

[selection]
mode = "anchored"
languages = ["en", "es", "de", "fr", "pt"]
anchor_limit = 20

[checkpoint]
enabled = true
work_dir = "benchmark_work"
resume = true
run_id = "auto"

[checkpoint.reuse]
selection = true
candidate_extraction = true
external_evidence_enrichment = true
llm_curation = true
manifest = true

[terminology]
domain = "jrc"
candidate_max_terms = 40
refined_max_terms = 8
model = "gpt-4.1-mini"
base_url = "https://api.openai.com/v1"
api_mode = "responses"
max_output_tokens = 1024
candidate_extractors = ["llm_legal", "stanza_ud", "xlmr_nobi", "spacy"]
external_evidence_sources = ["local_iate", "wikidata", "unterm"]
local_iate_path = "data/iate"
llm_curation = true
workers = 2
legal_workers = 2
stanza_workers = 2
openai_timeout = 120.0
