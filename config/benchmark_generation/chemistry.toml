name = "google_patents_chemistry"
domain = "chemistry"

[[builds]]
name = "google_patents"
kind = "google_patents_snapshot"
source_pairs_jsonl = "benchmark_sources/google_patents_within_document_pairs_250_per_language_pair.jsonl"
output_dir = "benchmark_datasets/google_patents_within_document_pairs_250_per_pair"

[selection]
mode = "per_direction"
languages = ["de", "en", "es", "fr", "ru", "zh"]
limit = 250
bidirectional = true

[checkpoint]
enabled = true
work_dir = "benchmark_work"
resume = true
run_id = "auto"

[checkpoint.reuse]
selection = true
candidate_extraction = true
external_evidence_enrichment = true
llm_curation = true
manifest = true

[terminology]
domain = "chemistry"
candidate_max_terms = 40
refined_max_terms = 8
model = "gpt-4.1-mini"
base_url = "https://api.openai.com/v1"
api_mode = "responses"
max_output_tokens = 1024
candidate_extractors = ["llm_chemistry", "stanza_ud", "xlmr_nobi", "spacy"]
external_evidence_sources = ["local_iate", "wikidata", "pubchem", "chebi", "chembl", "mesh", "nci", "agrovoc"]
local_iate_path = "data/iate"
llm_curation = true
workers = 2
openai_timeout = 120.0

